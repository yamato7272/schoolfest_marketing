<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Photo Reveal Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>売上をチェックだぜ！</h2>
    <div class="container">
      <div class="grid" id="grid"></div>
    </div>

    <button id="revealBtn">購入ありがとう！</button>
    <button id="saveBtn" style="background-color: lightgray">
      💾 Save CSV
    </button>
    <button id="uploadBtn" style="background-color: lightgray">
      📂 Load CSV
    </button>
    <input type="file" id="fileInput" accept=".csv" />

    <div class="progress" id="progress"></div>

    <script src="script.js"></script>
  </body>
</html>
