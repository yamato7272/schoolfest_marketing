<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Reveal Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      margin: 20px;
      background: #f0f0f0;
    }

    .container {
      position: relative;
      width: 750px;   /* 15:10 ratio */
      height: 500px;
      background: url("./img/london.jpg") center/cover no-repeat;
      border: 2px solid #333;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .grid {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(15, 1fr); /* 15 x 10 = 150 */
      grid-template-rows: repeat(10, 1fr);
    }

    .box {
      background: rgba(255, 255, 255, 1.0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #444;
      border: 1px solid #ccc;
      user-select: none;
      transition: all 0.3s ease;
    }

    .revealed {
      background: transparent !important;
      color: transparent !important;
      border: none !important;
      cursor: default !important;
      transform: none !important;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #45a049;
    }

    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    .progress {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    /* hide real file input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <h2>売上をチェックだぜ！</h2>
  <div class="container">
    <div class="grid" id="grid"></div>
  </div>
  
  <button id="revealBtn">購入ありがとう！</button>
  <button id="saveBtn" style="background-color: lightgray;">💾 Save CSV</button>
  <button id="uploadBtn" style="background-color: lightgray;">📂 Load CSV</button>
  <input type="file" id="fileInput" accept=".csv" />
  
  <div class="progress" id="progress"></div>

  <script>
    const grid = document.getElementById("grid");
    const revealBtn = document.getElementById("revealBtn");
    const saveBtn = document.getElementById("saveBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const progress = document.getElementById("progress");
    const totalBoxes = 150;
    
    let revealedNumbers = new Set();

    // Create 150 boxes
    for (let i = 1; i <= totalBoxes; i++) {
      const div = document.createElement("div");
      div.classList.add("box");
      div.textContent = i;
      div.dataset.index = i;
      grid.appendChild(div);
    }

    function updateProgress() {
      const revealedCount = revealedNumbers.size;
      const remaining = totalBoxes - revealedCount;
      progress.textContent = `Revealed: ${revealedCount}/${totalBoxes} (${remaining} remaining)`;
      
      if (revealedCount === totalBoxes) {
        revealBtn.textContent = "All revealed! 🎉";
        revealBtn.disabled = true;
      }
    }

    function revealBox(boxNumber) {
      if (revealedNumbers.has(boxNumber)) return;
      
      revealedNumbers.add(boxNumber);
      const box = document.querySelector(`.box[data-index='${boxNumber}']`);
      if (box) {
        box.classList.add("revealed");
      }
      updateProgress();
    }

    // Random reveal button
    revealBtn.addEventListener("click", () => {
      const remainingNumbers = [];
      for (let i = 1; i <= totalBoxes; i++) {
        if (!revealedNumbers.has(i)) {
          remainingNumbers.push(i);
        }
      }
      
      if (remainingNumbers.length === 0) {
        return;
      }
      
      const randomIndex = Math.floor(Math.random() * remainingNumbers.length);
      const randomBoxNumber = remainingNumbers[randomIndex];
      revealBox(randomBoxNumber);
    });

    // --- CSV Download ---
    saveBtn.addEventListener("click", () => {
      if (revealedNumbers.size === 0) {
        alert("No boxes revealed yet!");
        return;
      }
      const csvContent = "data:text/csv;charset=utf-8," + Array.from(revealedNumbers).join(",");
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", "revealed_boxes.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // --- Trigger file input via upload button ---
    uploadBtn.addEventListener("click", () => {
      fileInput.click();
    });

    // --- CSV Upload ---
    fileInput.addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        revealedNumbers = new Set(event.target.result.split(",").map(Number));
        // Reset all boxes
        document.querySelectorAll(".box").forEach(b => b.classList.remove("revealed"));
        // Reapply revealed state
        revealedNumbers.forEach(num => {
          const box = document.querySelector(`.box[data-index='${num}']`);
          if (box) box.classList.add("revealed");
        });
        updateProgress();
      };
      reader.readAsText(file);
    });

    // --- Alert before closing window ---
    window.addEventListener("beforeunload", function(e) {
      if (revealedNumbers.size > 0) {
        const confirmationMessage = "CSVを保存しましたか？";
        e.preventDefault();
        e.returnValue = confirmationMessage;
        return confirmationMessage;
      }
    });

    // Additional fallback for some browsers
    window.addEventListener("unload", function(e) {
      if (revealedNumbers.size > 0) {
        // Note: unload alerts don't work in modern browsers, but keeping for compatibility
        alert("CSVを保存しましたか？");
      }
    });

    // Initialize progress display
    updateProgress();
  </script>
</body>
</html>
