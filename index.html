<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>売上可視化ページ</title>
    <link rel="stylesheet" href="style.css" />
    <!--
  index.html
  - このファイルは売上可視化ページのHTML本体です。
  - style.css, script.jsと連携して動作します。
  - grid: タイル表示エリア。script.jsで150個のタイル(div)が自動生成されます。
  - salesInput: 売上本数を入力する欄。EnterでFirestoreに反映されます。
  - progress-container: 売上進捗バーと数値表示。
  - script.jsはtype="module"で読み込まれ、Firebase連携やUI制御を行います。
  - 画像やスタイルはstyle.cssで調整。
-->
  </head>
  <body>
    <h2>売上をチェックだぜ！</h2>
    <div class="container">
      <div class="grid" id="grid"></div>
      <input id="salesInput" type="number" placeholder="売上本数を入力" />
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
        <span id="progressText">0 / 1500</span>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
