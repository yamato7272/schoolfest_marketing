<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Photo Reveal Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-grid">
      <div class="left-col">
        <div class="container">
          <div class="grid" id="grid"></div>
        </div>
        <div
          id="tileCount"
          style="margin-top: 16px; font-size: 18px; text-align: center"
        ></div>
      </div>
      <div class="right-col">
        <h2>リポビタンＤ売り上げカウンター</h2>
        <div class="button-group">
          <button id="revealBtn1">購入＋１</button>
          <button id="revealBtn3">購入＋３</button>
          <button id="revealBtn10">購入＋１０</button>
        </div>
      </div>
    </div>
    <button
      id="toggleBtn"
      style="
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 1000;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #f0f0f0;
        color: #333;
        font-size: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        border: none;
      "
    ></button>
    <script type="module" src="script.js"></script>
    <script>
      const toggleBtn = document.getElementById("toggleBtn");
      const btnGroup = document.querySelector(".button-group");
      let hiddenState = false;
      toggleBtn.addEventListener("click", () => {
        hiddenState = !hiddenState;
        if (hiddenState) {
          if (btnGroup) btnGroup.style.display = "none";
          toggleBtn.textContent = "";
        } else {
          if (btnGroup) btnGroup.style.display = "";
          toggleBtn.textContent = "";
        }
      });
    </script>
  </body>
</html>
